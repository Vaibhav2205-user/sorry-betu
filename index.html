<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorry 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#7a1f45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,#ffd6e8,#ffb3d1 60%,#ff9ec4);font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);overflow:hidden}
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bg span{position:absolute;bottom:-60px;opacity:.65;animation:float linear infinite}
@keyframes float{to{transform:translateY(-120vh) rotate(25deg)}}
.page{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.page.on{display:flex;animation:in .5s ease}
@keyframes in{from{opacity:0;transform:scale(.94)}}
h1{font-size:clamp(28px,8vw,52px);margin:0;line-height:1.1;text-shadow:0 2px 0 #fff9}
svg.scene{width:min(80vw,310px);height:auto;overflow:visible;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.btns{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;justify-content:center}
button{font:700 20px 'Baloo 2',system-ui,sans-serif;border:0;border-radius:999px;padding:10px 26px;cursor:pointer;box-shadow:0 5px 0 #0002;transition:transform .15s}
button:active{transform:translateY(3px)}
.yes{background:#ff4f8b;color:#fff}.no{background:#fff;color:var(--ink)}
.hh{font-size:22px;animation:up 2.6s ease-in infinite}
@keyframes up{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-150px) scale(1.2);opacity:0}}
.rain{animation:rain .8s linear infinite}
@keyframes rain{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(190px);opacity:0}}
.td{animation:td 1.5s ease-in infinite}
@keyframes td{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(40px);opacity:0}}
.tw{animation:tw 1s ease-in-out infinite}
@keyframes tw{50%{opacity:.2}}
.sub{margin:0;font-size:19px;font-style:italic;opacity:.85;max-width:320px}
.hop{animation:hop .35s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-10px)}}
</style></head><body>
<div id="bg"></div><div id="app"></div>
